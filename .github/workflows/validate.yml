name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - run: python scripts/validate.py
      - if: github.event_name == 'pull_request'
        run: python scripts/validate.py --base origin/${{ github.base_ref }}
      # main 직접 푸시도 별칭 삭제·이름 변경 규칙을 본다(직전 커밋과 비교).
      - if: github.event_name == 'push'
        run: python scripts/validate.py --base ${{ github.event.before }}
